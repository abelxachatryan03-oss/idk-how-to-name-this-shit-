name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build implant
        run: |
          x86_64-w64-mingw32-g++ -std=c++20 -O2 -static \
            -o implant.exe implant.cpp \
            -lwinhttp -lshell32 -ladvapi32 -lole32 -luuid -lcrypt32 \
            -luser32 -lgdi32 -lwinmm \
            -mwindows -Wl,-e,WinMainCRTStartup

      - name: Build panel
        run: |
          x86_64-w64-mingw32-g++ -std=c++20 -O2 -static \
            -o panel.exe panel.cpp \
            -lwinhttp -lole32 -luuid \
            -mconsole

      - name: Commit exe files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f implant.exe panel.exe
          git diff --staged --quiet || git commit -m "ci: build exe [skip ci]"
          git pull --rebase origin main || true
          git push
